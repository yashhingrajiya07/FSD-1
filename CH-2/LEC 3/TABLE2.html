<html>
    <head>
        <title>LEC 3(3)</title>
    </head>
    <body>
        <table border="1" cellpadding="5" rules="all">
            <caption>ROWSPAN</caption>
            <tr align="center">
                <td rowspan="2" >A</td>
                <td>B</td>
            </tr>
            <tr align="center">
                <td>C</td>
            </tr>
        </table>
         <table border="1" cellpadding="5" rules="all">
            <caption>COLSPAN</caption>
            <tr>
                <td colspan="2" align="center">A</td>
            </tr>
            <tr align="center">
                <td>B</td>
                <td>C</td>
            </tr>
        </table>
    </body>
</html>
