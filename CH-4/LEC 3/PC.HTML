<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEC 3(1)</title>
    <style>
        a:link{color: blue;text-decoration: none;font-size: 40px;}
        a:visited{color: green;}
        a:hover{color: red;}
        a:active{color: purple;}
        input:focus{background-color: rgb(241, 55, 126); color: rgb(141, 9, 250); padding: 20px; }
        ul li:nth-child(even){font-size: 30px;background-color: rgb(22, 121, 233);}
        ul li:not(.active){background-color: rgb(184, 62, 6);font-size: 35px;}
    </style>
</head>
<body>
    <a href="https://www.youtube.com/" target="_blank">Click here</a>
    <input type="text" value="test">
    <ul>
        <li>task 1</li>
        <li>task 2</li>
        <li>task 3</li>
        <li class="active">task 4</li>
    </ul>
</body>
</html>
