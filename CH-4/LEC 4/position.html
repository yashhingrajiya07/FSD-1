<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 800px;
            border: 1px solid red;
            margin-top: 50px;
            position: relative;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 1px solid;
            text-align: center;
            font-size: 30px;
            padding: 20px;
        }
        #b1{
            background-color: yellow;
            top: 50px;
            left: 50px;
            position: static;
            z-index: -1;
        }
        #b2{
            background-color: green;
            position: relative;
            right: 50px;
            top: 50px;
            z-index: -2;
        }
        #b3{
            background-color: red;
            position: absolute;
            top: 0;
            right: 20px;
        }
        #b4{
            background-color: blue;
            position: fixed; bottom: 0;
            right: 100px;
            border-radius: 50%;
        }
        #b5{
            background-color: lightgreen;
            position: sticky;
            top: 0;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="b1"> 1  </div>
        <div class="box" id="b2"> 2  </div>
        <div class="box" id="b3"> 3  </div>
        <div class="box" id="b4"> 4  </div>
        <div class="box" id="b5"> 5  </div>
    </div>
    <div class="container1"></div>
</body>
</html>
