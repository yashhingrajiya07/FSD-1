<!--Flex Box-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px;
            text-align: center;
            background-color: lightgreen;
        }
        .container{
            display: flex;
            background-color: lightgrey;
            padding: 20px;
            gap: 10px;
            flex-direction: row; /* other properties such as row-reverse,column,column-reverse are also present.*/
            justify-content: flex-start; /* also has center,flex-end etc*/
            align-items: stretch;
            height: 300px;
            flex-wrap: wrap; /* wrap and wrap-reverse.*/
        }
        .box:nth-child(2){
            order: 3;
            flex: 1 1 100px; /*grow and shrink*/
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"> 1 </div>
        <div class="box"> 2 </div>
        <div class="box"> 3 </div>
        <div class="box"> 4 </div>
        <div class="box"> 5 </div>
        <div class="box"> 6 </div>
        <div class="box"> 7 </div>
        <div class="box"> 8 </div>
        <div class="box"> 9 </div>
        <div class="box"> 10 </div>  
    </div>
    
</body>
</html>
