<!--Display Properties.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .d1,.d2{
            display: inline-block;
            border: 1px solid red;
            height: 100px;
            width: 100px;
            padding: 10px;
            margin-top: 50px;
        }
        .s1{
            text-align: center;
            display: block;
        }
        .s2{
            display: block;
            margin: auto;
        }
        img{
            height: 350px;
            width: 350px;
            border-radius: 30px;
            display: block;
            margin: auto;
        }
    </style>
</head>
<body>
    <div class="d1"> Box 1 </div>
    <div class="d2"> Box 2 </div>
    <span class="s1"> Inline Element 1 </span>
    <span class="s2"> 
        Inline Element 2
        <img src="image4.webp" alt="HP"> 
    </span>
</body>
</html>
