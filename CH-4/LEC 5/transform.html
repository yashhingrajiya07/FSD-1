<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEX 5(5)</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            padding: 20px;
            border: 6px solid blue;
            background-color: lightblue;
            /*text-align: center;*/
            font-size: 20px;
            margin: 50px auto;
        }
        image{
            width: 150px;
            height: 150px;
            display: block;
            margin: 50px auto;
        }
        #b1:hover{
            transform: translate(20px,-20px);
            /*transform: translateX(20px);  <-> translate(20px,0px) */
            /*transform: translateY(-20px); <-> translate(0px,20px) */
        }
        #b2:active{
            /*transform: scale(2,1); <-> scaleX(2)
            transform: scale(0.5,0.5); <-> scale(0.5)
            transform: scale(1,2);  <-> scaleY(2)
            transform: scale(-1);
            transform: scaleX(-1);*/
            transform: scale(-1);
        }
        #b3:hover{
            /*transform: rotate(45deg); colckwise*/
            transform: rotate(-45deg);
        }
        #b4:hover{
            /*transform: skew(20deg);
            transform: skewX(20deg);  <->  skew(20deg,0deg)
            transform: skewY(20deg);  <->  skew(0deg,20deg)*/
            transform: skew(20deg,20deg);
        }
        img:hover{
            transform: translate(20px) scale(1.3) skew(10deg) rotate(90deg);

        }
    </style>
</head>
<body>
    <div class="box" id="b1">Translate</div>
    <div class="box" id="b2">SCale</div>
    <div class="box" id="b3">Rotate</div>
    <div class="box" id="b4">Skew</div>
    <img src="task.PNG">
</body>
</html>
