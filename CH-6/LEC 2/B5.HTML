<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
   </head>
  <body>
    <div class="container my-3 p-4 bg-light border border-3 border-dark">
        <div class="row">
            <div class="col bg-warning p-2">1</div>
            <div class="col bg-danger p-2">2</div>
            <div class="col bg-dark p-2">3</div>
        </div>
    </div>
    <div class="container my-3 p-4 bg-light border border-3 border-dark">
        <div class="row">
            <div class="col-4 bg-warning p-2">1</div>
            <div class="col-4 bg-danger p-2">2</div>
            <div class="col-4 bg-dark p-2">3</div>
        </div>
    </div>
    <div class="container my-3 p-4 bg-light border border-3 border-dark">
        <div class="row">
            <div class="col-md-4 bg-dark p-3">1</div>
            <div class="col-md-8 bg-info p-3">2</div>
        </div>
    </div>
    <div class="container my-3 p-4 bg-light border border-3 border-dark">
        <div class="row">
            <div class="col-sm-6 bg-dark p-3">1</div>
            <div class="col-sm-6 bg-info p-3">2</div>
        </div>
    </div>
  </body>
</html>
