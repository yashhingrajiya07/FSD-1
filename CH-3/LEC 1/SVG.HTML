<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEC 1(5)</title>
</head>
<body>
    <SVG height="200" width="200" style="border: 1px solid red ">
        <line x1="50" y1="50" x2="150" y2="150" stroke="black" stroke-width="7"/>
        <line x1="50" y1="150" x2="150" y2="50" stroke="GREY" stroke-width="8"/>
    </SVG>
    <SVG height="200" width="200" style="border: 1px solid BLACK ">
        <CIRCLE CX="100" CY="100" R="40"stroke="GREY" stroke-width="5" FILL="LIGHTBLUE"/>
        <CIRCLE CX="100" CY="200" R="40"stroke="GREY" stroke-width="5" FILL="LIGHTBLUE"/>
        <CIRCLE CX="100" CY="0" R="40"stroke="GREY" stroke-width="5" FILL="LIGHTBLUE"/>
        <CIRCLE CX="200" CY="100" R="40"stroke="GREY" stroke-width="5" FILL="LIGHTBLUE"/>
        <CIRCLE CX="0" CY="100" R="40"stroke="GREY" stroke-width="5" FILL="LIGHTBLUE"/>
    </SVG>
        <SVG height="200" width="200" style="border: 1px solid BLACK ">
            
            <CIRCLE CX="100" CY="100" R="90"stroke="GREY" stroke-width="0" FILL="violet"/>
            <CIRCLE CX="100" CY="100" R="80"stroke="GREY" stroke-width="0" FILL="indigo"/>
            <CIRCLE CX="100" CY="100" R="70"stroke="GREY" stroke-width="0" FILL="blue"/>
            <CIRCLE CX="100" CY="100" R="60"stroke="GREY" stroke-width="0" FILL="green"/>
            <CIRCLE CX="100" CY="100" R="50"stroke="GREY" stroke-width="0" FILL="yellow"/>
            <CIRCLE CX="100" CY="100" R="40"stroke="GREY" stroke-width="0" FILL="orange"/>
            <CIRCLE CX="100" CY="100" R="30"stroke="GREY" stroke-width="0" FILL="red"/>
    </SVG>
    <SVG height="200" width="200" style="border: 1px solid red ">
        <RECT width="100" height="50" stroke="lightpurple" stroke-width="5" fill="lightblue" x="50" y="80"/>
    </SVG>
    <SVG height="200" width="200" style="border: 1px solid red ">
        <ellipse cx="100" cy="100" rx="70" ry="40" stroke="black" stroke-width="5" fill="lightblue" />
        <ellipse cx="100" cy="100" rx="40" ry="70" stroke="black" stroke-width="5" fill="lightblue" />
    </SVG>
</body>
</html>
