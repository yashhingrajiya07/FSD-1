<html>
    <head>
        <title>LEC 1</title>
    </head>
    <body>
        <form action="submit.html" method="get">
            <fieldset>
                <legend>PERSONAL INFORMATION</legend>
                <label for="uname">Username:</label>
                <input type="text" id="uname" name="un" placeholder="Enter your Name" autofocus autocomplete required value="NAS" ><br><br>
                <label>Email Id:</label>
                <input type="email" name="eid" placeholder="abc@gmail.com" required /><br><br>
                <label>Password:</label>
                <input type="password" placeholder="Enter Password" maxlength="10" minlength="7" required /><br><br>
                <label>Contanct No.:</label>
                <input type="tel" maxlength="10" minlength="10" name="cn" placeholder="+91 xxxxx xxxxx"/><br><br>
                <label >Age:</label>
                <input type="number" min="10" max="25" value="18" step="1" name="age" />
            </fieldset>
            <fieldset>
                <legend>ADDITIONAL INFORMATION</legend>
                <label>DOB:</label>
                <input type="date" name="dob" min="2001-01-01" max="2026-09-01">
                <label>Fav Color:</label>
                <input type="color" name="favcolor" value="#000000"><br><br>
                <label>Rating:</label>
                <input type="range" min="0" max="10" step="1" value="5" name="rating" oninput="my.innerHTML=this.value">
                <span id="my">5</span><br><br>
                <label>Gender:</label>
                <input type="radio" name="gender" value="male" checked />MALE
                <input type="radio" name="gender" value="female" />
                <br><br>
                <hr width="100%" height="200" size="3" color="black" align="center">
                <br>
                <label>Subject:</label>
                <input type="checkbox" name="subject" value="FSD-1" checked>FSD-1
                <input type="checkbox" name="subject" value="PYTHON-1" >PYTHON-1
                <input type="checkbox" name="subject" value="DE" >DE
                <input type="checkbox" name="subject" value="PS" />PS
                <br>
                <br>
                <label>Comments:</label>
                <textarea cols="70" rows="8" name="comments" placeholder="Enter your comments" align="left">My first Comment </textarea><br><br>
                <label>City:</label>
                <select name="City">
                    <option value="" selected disabled>select</option>
                    <optgroup label="Gujarat">
                        <option value="ahm">Ahmedabad</option>
                        <option value="raj">Rajkot</option>
                        <option value="jam">Jamnagar</option>
                    </optgroup>
                    <optgroup label="Rajsthan">
                        <option value="jai">jaipur</option>
                        <option value="udi">udaipur</option>
                        <option value="nath">nathdwara</option>
                    </optgroup>
                </select><br><br>
                <label>Branch:</label>
                <input list="branch" name="branch">
                <datalist id="branch">
                    <option value="CSE"></option>
                    <option value="CE"></option>
                    <option value="MA&CP"></option>
                    
                </datalist>
            </fieldset>
            <fieldset>
                <legend>BUTTONS</legend>
                <input type="submit"  val="submit Data">
                <input type="reset" val="reset value">
                <input type="button" value="BUTTON"/>
                <button type="submit">Submit button</button>
                <button>Form submit</button>
            </fieldset>
        </form>
    </body>
</html>
