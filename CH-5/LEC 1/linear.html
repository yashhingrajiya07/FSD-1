<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEC 1(2)</title>
    <style>
        .d1{
            height: 200px;
            width: 200px;
            margin: 20px auto;
            background-image: linear-gradient(rgb(163, 38, 235),rgb(20, 210, 243),rgb(129, 214, 17) );
            background-color: bisque;
        }
        .d2{
            height: 200px;
            width: 200px;
            margin: 20px auto;
            background-image: linear-gradient(to top right, rgb(150, 24, 30),rgb(236, 194, 55),rgb(129, 214, 17) );
            background-color: bisque;
        }
        .d3{
            
            height: 200px;
            width: 200px;
            margin: 20px auto;
            background-image: linear-gradient(rgb(167, 49, 49) 30%,rgb(250, 250, 2) 50% , rgb(66, 146, 129) 20% );
            background-color: bisque;
        }
    </style>
</head>
<body>
    <div class="d1"></div>
    <div class="d2"></div>
    <div class="d3"></div>
</body>
</html>
