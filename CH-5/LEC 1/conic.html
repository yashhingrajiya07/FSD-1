<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .d1{
            height: 200px;
            width: 300px;
            margin: 10px auto;
            background-image: conic-gradient(from 180deg ,yellow,green,blue,purple,pink);
        }
        .d2{
            height: 200px;
            width: 300px;
            margin: 10px auto;
            background-image: conic-gradient(from 0deg ,yellow 45deg,green 90deg ,blue 120deg,purple 240deg,pink 360deg);
        }
        .d3{
            height: 200px;
            width: 300px;
            margin: 10px auto;
            background-image: conic-gradient(from 0deg ,red 0deg,red 90deg,green 90deg ,green 180deg,blue 180deg,blue 270deg,yellow 270deg,yellow 360deg);
        }
    </style>
</head>
<body>
    <div class="d1"></div>
    <div class="d2"></div>
    <div class="d3"></div>
</body>
</html>
